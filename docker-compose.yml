version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_MIRROR: ${DOCKER_MIRROR:-dockerhub.ime.co.ir/}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://linux.repo.ime.co.ir/repository/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://linux.repo.ime.co.ir/repository/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.repo.ime.co.ir linux.repo.ime.co.ir}
    container_name: ime_ollama_chatbot
    restart: unless-stopped
    env_file:
      - .env
    # در سرورهای لینوکس: اتصال مستقیم به شبکه هاست جهت دسترسی بدون واسطه به 0.0.0.0:11434
    network_mode: host
    volumes:
      # Persist SQLite database across container recreations
      - ./chatbot.db:/app/chatbot.db
      # Persist skills directory for admin uploads
      - ./skills:/app/skills
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      # تنظیمات سرویس زبانی (vLLM روی پورت 8005 یا gateway روی 8080 / Ollama روی 11434)
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://127.0.0.1:8005}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-8192}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-default}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production-2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - RETENTION_DAYS=${RETENTION_DAYS:-10}
      - MAX_MEMORY_MESSAGES=${MAX_MEMORY_MESSAGES:-12}
    extra_hosts:
      # Allows Linux, Mac, and Windows Docker engines to reach host services
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Bundled Ollama container (if running Ollama directly inside Docker)
  # To run with Ollama container: docker compose --profile with-ollama up -d
  ollama:
    image: ${DOCKER_MIRROR:-dockerhub.ime.co.ir/}ollama/ollama:latest
    container_name: ime_ollama_service
    profiles: ["with-ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:

